  /api/v1/deep-links/:
    post:
      operationId: deep_links_create
      description: |-
        Mint a shareable link. **The one authenticated route in this app.**

        Legacy's ``generate`` took no credential — but legacy's controller was never
        routed, so there is no production exposure to preserve and the safe default
        wins. Two reasons it needs a token: minting writes a row, so an open endpoint
        is an unbounded write; and ``invite`` links are a capability, so who created
        one is worth recording (``created_by``).

        A target that does not exist is rejected here rather than at tap time — see
        :func:`apps.cms.services.deeplinks.resolve_target`.
      tags:
      - deep-links
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeepLinkCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeepLinkCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeepLinkCreate'
        required: true
      security:
      - BearerJWT: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepLink'
          description: ''
  /api/v1/deep-links/resolve/:
    get:
      operationId: deep_links_resolve_retrieve
      description: |-
        What a token points at — the call the app makes after opening.

        Public because the app makes it during cold start, before the session is
        restored: a link tapped by a signed-out user has to resolve or the link is
        useless. It reveals only what the link itself already encodes, and an
        unknown or expired token is a flat 404 either way, so it cannot be used to
        enumerate.
      parameters:
      - in: query
        name: token
        schema:
          type: string
        required: true
      tags:
      - deep-links
      security:
      - BearerJWT: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepLink'
          description: ''
