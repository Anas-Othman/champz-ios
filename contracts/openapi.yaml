  /api/admin/v1/transfers/:
    get:
      operationId: api_admin_v1_transfers_list
      description: |-
        Transfer history — read-only. Replaces `/getAllTransferHistory` and
        `/getTransferHistoryByPlayer`.

        **`/transfer-player` is deliberately not here.** The panel's admin transfer
        action is the reason `transfer_history` has no `tournament_id` and hardcodes
        `transfer_fee = 50000`, `contract_duration = 24` (`v1/AdminController.php:2537`)
        — it was the table's only writer, and it wrote values nobody chose. T18 built
        the real transfer path as a service over the offer flow, so a second admin
        write path would be a second place for the club-move rules to drift, with
        the worse of the two shapes.

        Moving a player from the back office goes through that service, as
        ``POST /api/admin/v1/clubs/{club_id}/transfer-player/``
        (:meth:`AdminClubViewSet.transfer_player`) — an action on the destination
        club, not a write on this history. This stays read-only.

        ``?player_id=`` filters to one player's history, which is what the profile
        screen asks for.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - BearerJWT: []
      responses:
        '200':
