  /api/admin/v1/bookings/:
    get:
      operationId: api_admin_v1_bookings_list
      description: |-
        Replaces `/admin/get_bookings`, `/admin/create_booking`,
        `/admin/update_booking/{id}`, `/admin/delete_booking/{id}`, plus the
        actions the legacy panel never had a working endpoint for at all
        (reschedule, participants replace, cancel-with-refund, refund preview —
        Admin Panel Plan 3, Tasks B1-B5).

        ``?date=YYYY-MM-DD`` is the day schedule the manager's calendar screen
        draws; ``?date_from=&date_to=`` is the range the week view and the
        bookings list use.
      parameters:
      - in: query
        name: court
        schema:
          type: string
        description: Only rows whose court matches.
      - in: query
        name: court_id
        schema:
          type: string
        description: One court.
      - in: query
        name: date
        schema:
          type: string
        description: One day, YYYY-MM-DD.
      - in: query
        name: date_from
        schema:
          type: string
        description: Range start, YYYY-MM-DD (needs date_to too).
      - in: query
        name: date_to
        schema:
          type: string
        description: Range end, YYYY-MM-DD (needs date_from too; max 92 days).
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: participant
        schema:
          type: string
        description: Only rows whose participant matches.
      - in: query
        name: payment_status
        schema:
          type: string
        description: Only rows whose payment_status matches.
      - in: query
        name: recurring
        schema:
          type: string
        description: Only rows whose recurring matches.
      - in: query
        name: search
        schema:
          type: string
        description: Case-insensitive match on unique_id, participants__user__first_name,
          participants__user__last_name, participants__user__email, participants__user__phone,
          recurring_booking__title.
      - in: query
        name: status
        schema:
          type: string
        description: 1 active (default) | 0 cancelled | all (both).
      - in: query
        name: venue
        schema:
          type: string
        description: Only rows whose venue matches.
      tags:
      - api
      security:
      - BearerJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
    post:
      operationId: api_admin_v1_bookings_create
      description: |-
        Replaces `/admin/get_bookings`, `/admin/create_booking`,
        `/admin/update_booking/{id}`, `/admin/delete_booking/{id}`, plus the
        actions the legacy panel never had a working endpoint for at all
        (reschedule, participants replace, cancel-with-refund, refund preview —
        Admin Panel Plan 3, Tasks B1-B5).

        ``?date=YYYY-MM-DD`` is the day schedule the manager's calendar screen
        draws; ``?date_from=&date_to=`` is the range the week view and the
        bookings list use.
      tags:
