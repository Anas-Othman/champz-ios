    patch:
      operationId: profile_partial_update
      description: |-
        Partial update — send only the fields being changed, with the avatar as multipart. The profile updated is always the one the bearer token belongs to. There is no id to send, and an id in the body is ignored.

        `email` may be set by a player who has none — an account made through the phone-first signup — and changed by one who has. It is stored lower-cased and becomes an address the player can sign in with. There is no confirmation step: the one-time code sent at sign-in is the proof. **409** when another account already holds the address: `error.details` is written for the player to read, and `error.errors` names the `email` field, so the app can show it under the box rather than in a banner.

        `phone` and `country_code` work the same way, for a player who signed up by email. They are resolved together (a missing half is the stored one) and stored the way sign-in looks the number up, so `0555 12345` under `+974` is saved as `55512345`. **400** when it is not a phone number, **409** when another live account holds it, `error.errors` naming `phone`.
