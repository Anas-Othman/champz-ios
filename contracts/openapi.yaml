        name: date_from
        schema:
          type: string
        description: 'ISO date: only tournaments starting on or after it.'
      - in: query
        name: date_to
        schema:
          type: string
        description: 'ISO date: only tournaments starting on or before it.'
      - in: query
        name: ground_id
        schema:
          type: string
        description: Only tournaments at this venue.
      - in: query
        name: is_featured
        schema:
          type: boolean
        description: Only featured tournaments.
      - in: query
        name: latitude
        schema:
          type: number
          format: double
        description: 'Near me: with `longitude`, keep tournaments whose venue is in
          range. A tournament with no venue is kept.'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: longitude
        schema:
          type: number
          format: double
        description: 'Near me: with `latitude`.'
      - in: query
        name: radius
        schema:
          type: number
          format: double
