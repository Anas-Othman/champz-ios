      - expires_at
      - extra
      - link_type
      - target_id
      - token
      - url
      - web_path
      - web_url
    DeepLinkCreate:
      type: object
      description: |-
        Mint a shareable link.

        ``target_id`` accepts **either** a ULID or a legacy integer id, which is the
        whole point of the resolver: a link built from a legacy id keeps working
        after cutover. Named ``target_id`` rather than legacy's bare ``id`` because
        ``id`` in a request body reads as "the id of the thing being created".
      properties:
        link_type:
          $ref: '#/components/schemas/LinkTypeEnum'
        target_id:
          type: string
          default: ''
        extra:
          type: object
          additionalProperties: {}
      required:
      - link_type
    DeletionBlocker:
      type: object
      description: |-
        One thing standing between the caller and deleting their account.

        `kind` says which screen clears it: `club` means hand the club over to
        another player, and the other three mean play the fixture out or cancel it.
        `label` is the club's or the venue's or the game's name, and `on` is the date
        it happens — both there so the app can write a sentence naming the thing,
        rather than the API shipping a copy deck.
      properties:
        kind:
          $ref: '#/components/schemas/DeletionBlockerKindEnum'
