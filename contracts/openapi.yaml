  /api/v1/app-config/:
    get:
      operationId: app_config_retrieve
      description: |-
        Contact details, service fees and payment toggles — legacy's
        ``get-organizer-details``, which is not about organizers.

        **This closes a gap rather than porting a feature.** T2 declared all fourteen
        keys in ``apps.core.settings_registry`` and noted that they are "surfaced by
        the app's settings screen" — and nothing surfaced them. The client needs
        them to work at all, not to decorate: it computes what a player is about to
        pay from ``tournaments_fee``
        (``mycreatedteams/controller/mycreatedteamcontroller.dart:336,450``) and
        decides whether to offer cash from ``is_cash_enable`` (``:117``). Without
        this route, tournament and friendly-game checkout cannot show a correct
        total.

        Served from ``cms`` rather than ``core`` because that is this codebase's
        pattern for an app-facing read: ``apps.players`` serves ``/countries/`` and
        ``/positions/`` while the models live in ``core``. The screen's app owns the
        endpoint; ``core`` owns the data.

        One query. ``AdminSetting.objects.for_country`` reads the whole country's
        settings in a single fetch and types them through the registry, so the three
        fees here do not cost three queries — and a key with no row falls back to its
        registered default rather than failing.
