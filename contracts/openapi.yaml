          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        wallet_leg_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        purchase_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        currency:
