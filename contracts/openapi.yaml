        A court, plus the venue it belongs to.

        ``CourtSerializer`` is the shape the player-facing venue routes serve, where
        the court is always nested under the venue that was asked for, so naming the
        venue again would be noise. The panel's court list is the other way round:
        ``GET /courts/`` without a ``ground`` returns every venue's courts in one
        page, and the schedule grid draws them as columns side by side. Without these
        two fields two courts called "5v5 Court" at different venues are
        indistinguishable. Named ``venue_*`` rather than ``ground_*`` to match the
        booking rows the same screens already read (``Booking.venue_id`` /
        ``venue_name``); ``ground`` stays the write field and the filter parameter.
