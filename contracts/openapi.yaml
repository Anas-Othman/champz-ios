        ``image_url`` is an addition, not a port: legacy appends an accessor for
        banners but not for posts (``Posts.php`` declares no ``$appends``), so the
        client received a bare storage path and had to build the URL itself. Sending
        the resolved URL as well costs nothing and removes a place where the client
        can guess the base wrong. ``image`` still carries the raw path.
