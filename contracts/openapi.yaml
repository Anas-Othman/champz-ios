      description: |-
        * `match_fee` - Friendly game fee
        * `t_service_fee` - Tournament service fee
        * `bc_service_fee` - Court booking service fee
        * `fg_service_fee` - Friendly game service fee (historical)
        * `book_court` - Court booking payment
        * `commission` - Champz commission
        * `refund` - Refund
        * `settlement` - Venue settlement
        * `topup` - Wallet top-up
        * `topup_bonus` - Wallet top-up bonus
        * `transfer` - Wallet transfer
        * `legacy_import` - Imported legacy transaction
        * `account_closure` - Balance closed with the account
        * `unclaimed_credit` - Credit held for a closed account
        * `admin_adjustment` - Adjusted by staff
        * `opening_floor` - Negative opening balance written off
        * `opening_alignment` - Opening balance aligned to Legacy's displayed balance
    RecurrenceTypeEnum:
      enum:
