  /api/admin/v1/billing/:
    get:
      operationId: api_admin_v1_billing_retrieve
      description: |-
        ``GET /api/admin/v1/billing/`` — the Payments screen, one row per booking.

        Replaces `/billing-listing`. Court bookings, friendly-game joins and
        tournament joins in one list, each expandable to the players it covers, with
        the four revenue cards computed over every filtered row.

        Venue-scoped, so a manager sees only their own venues' money. The rules —
        including the production quirks this reproduces deliberately — live in
        :mod:`apps.core.billing_listing`; this view only reads filters and pages.
      parameters:
      - in: query
        name: booking_type
        schema:
          type: string
        description: all | book_a_court | friendly_game | tournament
      - in: query
        name: date_from
        schema:
          type: string
        description: YYYY-MM-DD, against the booking date
      - in: query
        name: date_to
        schema:
          type: string
        description: YYYY-MM-DD, against the booking date
      - in: query
        name: payment_method
        schema:
          type: string
        description: cash | wallet | online
      - in: query
        name: payment_status
        schema:
          type: string
        description: paid | unpaid | partial
      - in: query
        name: player_name
        schema:
          type: string
        description: Substring of the host's name
      - in: query
        name: venue_id
        schema:
          type: string
      tags:
      - api
      security:
      - BearerJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPage'
          description: ''
  /api/admin/v1/billing/export/:
    get:
      operationId: api_admin_v1_billing_export_retrieve
      description: |-
        ``GET /api/admin/v1/billing/export/`` — the same rows as CSV, one line per player.

        Replaces `/billing-export`. Same filters and the same venue scope as the
        list, built from the same function rather than a second query: an export
        that could show rows the on-screen list filters out is how a manager ends up
        with another venue's revenue in a spreadsheet.

        Player-level, as legacy's is — a booking-level CSV hides who actually paid.
        Unpaged: an export of page one is not an export.
      parameters:
      - in: query
        name: booking_type
        schema:
          type: string
        description: all | book_a_court | friendly_game | tournament
      - in: query
        name: date_from
        schema:
          type: string
        description: YYYY-MM-DD, against the booking date
      - in: query
        name: date_to
        schema:
          type: string
        description: YYYY-MM-DD, against the booking date
      - in: query
        name: payment_method
        schema:
          type: string
        description: cash | wallet | online
      - in: query
        name: payment_status
        schema:
          type: string
        description: paid | unpaid | partial
      - in: query
        name: player_name
        schema:
          type: string
        description: Substring of the host's name
      - in: query
        name: venue_id
        schema:
          type: string
      tags:
      - api
      security:
      - BearerJWT: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: ''
  /api/admin/v1/billing/mark-paid/:
    post:
      operationId: api_admin_v1_billing_mark_paid_create
      description: |-
        ``POST /api/admin/v1/billing/mark-paid/`` — record a cash payment at the counter.

        Replaces the panel's `/billing-mark-participant-paid`. **A money path**: it
        credits the company wallet and releases the booking into the settlement run
        (`settlements/engine.py:184` holds a booking back while any non-owner
        participant is unpaid). The rules and the one departure from legacy live in
        :mod:`apps.bookings.services.billing`, not here — a view is the wrong place
        for money.

        Super-admin-only in legacy, via a `super.admin` middleware. Here that is an
        ordinary Django permission plus the venue check inside the service, so
        Django admin honours the same grant (ADR-0021).
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkPaid'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarkPaid'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarkPaid'
        required: true
      security:
      - BearerJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
          description: ''
        '423':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Payments are paused (error.code 02050). Retry-After gives seconds;
            X-Champz-Stack identifies the answering stack.
  /api/admin/v1/booking-participants/:
