        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/wallet/topup/bonus-preview/:
    get:
      operationId: wallet_topup_bonus_preview_retrieve
      description: |-
        ``GET /wallet/topup/bonus-preview/`` — what a top-up would be worth.

        Parity with legacy's ``calculate-topup-bonus-amount``, with one difference
        that matters: the answer is advisory. Legacy's client posts the figure back as
        ``bonus_amount`` and the server credits whatever arrives, so that endpoint is
