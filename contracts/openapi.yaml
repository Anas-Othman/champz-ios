      properties:
        id:
          type: string
          default: ''
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        name:
          type: string
          default: ''
          maxLength: 255
        legacy_id:
          type: integer
          default: 0
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        country:
          type: string
          default: ''
      required:
      - country
      - created_at
      - deleted_at
      - id
      - name
      - updated_at
    AdminClub:
