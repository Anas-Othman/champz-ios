components:
  schemas:
    Accepted:
      type: object
      description: The deliberately uninformative answer. See the view.
      properties:
        detail:
          type: string
          default: ''
      required:
      - detail
    AccoladeRecord:
      type: object
      description: One award earned in a tournament.
      properties:
        name:
          type: string
          default: ''
          readOnly: true
        tournament_name:
          type: string
          default: ''
          readOnly: true
          nullable: true
      required:
      - name
      - tournament_name
    AddFreeAgent:
      type: object
      description: A captain pulling a player out of the free-agent pool.
      properties:
        club_id:
          type: string
          default: ''
        player_id:
          type: string
          default: ''
      required:
      - club_id
      - player_id
    AdminAccolade:
      type: object
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        title:
          type: string
          default: ''
          maxLength: 255
        description:
          type: string
          default: ''
        legacy_id:
          type: integer
          default: 0
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        player:
          type: string
          default: ''
        tournament:
          type: string
          default: ''
          nullable: true
      required:
      - created_at
      - deleted_at
      - id
      - player
      - title
      - updated_at
    AdminAdjustment:
      type: object
      description: The audit trail for staff-made movements.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        player:
          type: string
          default: ''
          readOnly: true
          nullable: true
        player_name:
          type: string
          default: ''
          readOnly: true
        actor:
          type: string
          default: ''
          readOnly: true
          nullable: true
        actor_name:
          type: string
          default: ''
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        reason:
          type: string
          default: ''
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - actor_name
      - amount
      - created_at
      - id
      - player
      - player_name
      - reason
    AdminBookingCreate:
      type: object
      description: |-
        ``AdminBookingCreate`` — the manager panel's "new booking" form.

        No ``price``: the server prices the window (NFR-010), the same rule
        ``BookingCreateSerializer`` already enforces on the player surface. No
        top-level ``payment_method`` either — a single value cannot express "two
        of four participants paid cash, the rest are unpaid".
      properties:
        court:
          type: string
          default: ''
        date:
          type: string
          format: date
        start_time:
          type: string
          default: ''
          format: time
        duration:
          type: integer
          default: 0
          minimum: 1
        payment_type:
          $ref: '#/components/schemas/PaymentTypeEnum'
        participants:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/AdminBookingCreateParticipant'
        private_notes:
          type: string
          default: ''
        public_notes:
          type: string
          default: ''
        booking_name:
          type: string
          default: ''
        booking_email:
          oneOf:
          - type: string
            format: email
            default: ''
          - type: string
            maxLength: 0
        booking_country_code:
          type: string
          default: ''
        booking_phone:
          type: string
          default: ''
      required:
      - court
      - date
      - duration
      - participants
      - payment_type
      - start_time
    AdminBookingCreateParticipant:
      type: object
      description: |-
        One person on a staff-made booking.

        ``paid_cash`` is not a payment method ``BookingService`` understands — it
        triggers a counter receipt through
        :func:`apps.bookings.services.billing.mark_participant_paid` once the
        booking exists, the same path the billing screen uses.
      properties:
        user:
          type: string
          default: ''
        is_owner:
          type: boolean
          default: false
        paid_cash:
          type: boolean
          default: false
      required:
      - user
    AdminBookingUpdate:
      type: object
      description: |-
        ``PatchedAdminBookingUpdate``.

        Notes and contact fields are always writable. Naming any of
        ``court``/``date``/``start_time``/``duration`` triggers a reschedule
        through :func:`apps.bookings.services.admin_booking.reschedule`, which
        refuses once anything on the booking is paid. ``PUT`` is disabled at the
        viewset (``http_method_names``) — this serializer only ever runs partial.
      properties:
        court:
          type: string
          default: ''
        date:
          type: string
          format: date
        start_time:
          type: string
          default: ''
          format: time
        duration:
          type: integer
          default: 0
          minimum: 1
        private_notes:
          type: string
          default: ''
        public_notes:
          type: string
          default: ''
        booking_name:
          type: string
          default: ''
        booking_email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        booking_country_code:
          type: string
          default: ''
        booking_phone:
          type: string
          default: ''
    AdminCancellationPolicy:
      type: object
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        hours:
          type: integer
          default: 0
          maximum: 2147483647
          minimum: 0
        refund_percentage:
          type: string
