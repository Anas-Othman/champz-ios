  /api/v1/profile/deletion/:
    get:
      operationId: profile_deletion_retrieve
      description: A dry run of the `POST` below. `can_delete` false means `blockers`
        lists what to clear first; a non-zero `wallet_balance` means the delete needs
        a `balance_disposition`. Nothing is changed by calling this.
      summary: Can I delete my account?
      tags:
      - profile
      security:
      - BearerJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDeletionState'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: profile_deletion_create
      description: |-
        Soft-deletes the caller's account. Every token dies immediately, so the next request on this device answers 401.

        **Refused (409)** while the caller captains a club (`ACCOUNT_OWNS_CLUB`) or holds an unplayed booking or paid join (`ACCOUNT_HAS_COMMITMENT`). Call `GET /profile/deletion/` first to find out which, and to get the club or fixture's name.

        **A wallet balance does not block deletion**, but it has to be dealt with: send `balance_disposition`, or the answer is `400 BALANCE_DISPOSITION_REQUIRED`.

        The account can be restored by signing in on the same phone within the reactivation window; after that it is removed for good and any balance left goes to Champz. There is deliberately no push notification — the confirmation is this response, and the device's push tokens are retired in the same transaction.
      summary: Delete my account
      tags:
      - profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileDelete'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileDelete'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileDelete'
      security:
      - BearerJWT: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '423':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Payments are paused (error.code 02050). Retry-After gives seconds;
            X-Champz-Stack identifies the answering stack.
