                additionalProperties: {}
          description: Payments are paused (error.code 02050). Retry-After gives seconds;
            X-Champz-Stack identifies the answering stack.
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
