  /api/admin/v1/dashboard/send-payment-reminder/:
    post:
      operationId: api_admin_v1_dashboard_send_payment_reminder_create
      description: |-
        ``POST /api/admin/v1/dashboard/send-payment-reminder/`` — chase a split booking.

        Replaces the panel's `/dashboard/manager-send-payment-reminder`. A manager
        looks at a booking where some participants have not paid and nudges them,
        rather than waiting for the 12h/3h cron.

        **It reuses T16's `send_member_reminders` rather than composing its own
        push.** That function decides who is chaseable — unpaid, non-owner, not
        declined, still owing — and sets the accept/decline flags from whether the
        slot has passed. A second implementation would be a second answer to "who
        counts as unpaid", and the two would drift.

        **Venue-scoped.** A manager may only chase bookings at venues they manage;
        a super admin may chase any. Without that check this is a way to make the
        platform send messages to strangers' customers, which is exactly the class
        of hole DD BE-02 left open.

        Deliberately **not** idempotent-stamped. The cron records
        `court_reminder_12h_sent_at` so it fires once; a manual nudge is a person
        deciding to chase again, and refusing the second one would make the button
        look broken. The rate limit on that is the manager's judgement, as it is
        today.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPaymentReminder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendPaymentReminder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendPaymentReminder'
        required: true
      security:
      - BearerJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderSent'
          description: ''
