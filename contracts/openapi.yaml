  /api/admin/v1/dashboard/summary-stats/:
    get:
      operationId: api_admin_v1_dashboard_summary_stats_retrieve
      description: |-
        ``GET /api/admin/v1/dashboard/summary-stats`` — the platform-wide cards.

        Each number is legacy's definition, transcribed:

        ``total_users``
            Every registered non-guest account, **ignoring the date range**. Legacy
            counts `AppUser::where('is_guest', 0)` with no period filter, so the card
            does not move when the range changes. Here that is `user_type=player`,
            because guests are their own table under ADR-0004 rather than a flag.

        ``total_active_users``
            Non-guest accounts that placed **any** event in the range — a court
            booking (by `bookings.date`), a join request (by `created_at`), or a match
            they created (by `match_date`). Note the three use different date columns;
            that is legacy's choice and it is kept, because a booking is "active" on
            the day it is played while a join is active when it is made.

        ``total_active_paying_users``
            Accounts with a *paid* booking participation or join in the range. Legacy
            also unions two wallet-transaction sources; those become ledger entries
            here, and are deliberately **not** included yet — the mapping from
            legacy's `payment_method` strings to ledger reason codes is P-01's
            neighbour and unresolved, so counting them would be a guess. The number
            is therefore a floor, and the docstring says so rather than the card
            quietly under-reporting.

        ``new_players``
            Accounts created in the range that have a player profile. Legacy joins
            `players`, so an account with no profile row does not count.
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
        description: YYYY-MM-DD, inclusive.
      - in: query
        name: start_date
        schema:
          type: string
        description: YYYY-MM-DD, inclusive.
      tags:
      - api
      security:
      - BearerJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryStats'
          description: ''
