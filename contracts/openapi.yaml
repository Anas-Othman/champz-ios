  /api/admin/v1/matches/{match_id}/scores/:
    get:
      operationId: api_admin_v1_matches_scores_retrieve
      description: |-
        ``GET /api/admin/v1/matches/{match_id}/scores/`` — WSO scores, grouped by team.

        Replaces `/getWsoScoresByMatchId/{id}`, which was the **one row in the whole
        inventory where a confident mapping turned out to be wrong**. It looked like
        `/api/v1/games/{match_id}/scoreboard/` on the strength of the name; that path
        is `PUT` only — it is `updateScoreboard`, a write — and there was no read of
        WSO scores anywhere on the new API.

        Legacy's shape, kept: one entry per team, each carrying its players'
        per-slot goals. `host_id` is legacy's payer column; here that is `paid_by`,
        which is null when the player paid for their own slot rather than 0.

        Team slot ordering is what these scores align to, which is why `ordering` is
        the sort key rather than the player's name — reordering teams through a
        generic write is the failure this guards against, and why
        :class:`~apps.games.admin_api.AdminTeamViewSet` is read-only.
      parameters:
      - in: path
        name: match_id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - BearerJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/v1/organizers/:
    get:
      operationId: api_admin_v1_organizers_list
      description: |-
        Who ran a match. Replaces `/organizers`, `/organizers/active`,
        `/organizers/{id}` and its create, update and delete.

        ``?active=1`` is the panel's `/organizers/active` — one list with a filter
        rather than two endpoints, because the difference between them was a
        ``where`` clause and nothing else.

        ``?search=`` matches name or phone, which is what legacy's `index` does with
        its optional search parameter.
      parameters:
      - in: query
        name: active
        schema:
          type: string
