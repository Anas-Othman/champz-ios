      description: |-
        * `goalkeeper` - Goalkeeper
        * `defender` - Defender
        * `midfielder` - Midfielder
        * `striker` - Striker
        * `joker` - Joker
    Court:
      type: object
      description: |-
        One playing surface, with the priced windows on it.

        ``slots`` reads whatever was prefetched onto the court — every view here
        prefetches active ones only — but always excludes soft-deleted rows.
        Filtering in Python off ``court.slots.all()`` (rather than
        ``court.slots.filter(deleted_at__isnull=True)``) keeps any
        ``prefetch_related("slots")``/``courts__slots`` cache intact instead of
        issuing a fresh query per court.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        name:
          type: string
          default: ''
          readOnly: true
        court_type:
          type: string
          default: ''
          readOnly: true
        start_time:
          type: string
          default: ''
          format: time
          readOnly: true
          nullable: true
        end_time:
          type: string
          default: ''
          format: time
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
        slots:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/CourtSlot'
          readOnly: true
      required:
      - court_type
      - end_time
      - id
      - is_active
      - name
      - slots
      - start_time
    CourtDefaultPrice:
      type: object
      description: |-
        One entry of ``VenueSetting.court_default_prices``: legacy's blank-or-
        numeric price and active flag for a single duration.

        Legacy truth: ``SettingsValidator.php`` — ``'court_default_prices.*.price'
        => ['nullable','numeric','min:1']`` — and ``SettingsService.php``, which
        stores a blank or missing price as ``null``. ``price`` has no notion of a
        blank number, so ``to_internal_value`` folds ``""`` to ``None`` before the
        field ever sees it; that is done here rather than in ``DecimalField``
        itself so it stays this row's rule, not every decimal field's.
      properties:
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        active:
          type: boolean
          default: true
    CourtSlot:
      type: object
      description: |-
        A priced window on a court.

        ``lowest_price`` is ``price_60`` — literally, not the minimum of the five.
        Production aliases the column (``addSelect('price_60 as lowest_price')``) and
        the app renders it as "from QAR x", so a venue whose 90-minute rate is
        cheaper per hour still advertises the 60-minute price. Kept as production
        has it; renaming it would be a UI change.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        start_time:
          type: string
          default: ''
          format: time
          readOnly: true
        end_time:
          type: string
          default: ''
          format: time
          readOnly: true
        price_60:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        price_90:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        price_120:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        price_150:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        price_180:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        lowest_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - end_time
      - id
      - is_active
      - lowest_price
      - price_120
      - price_150
      - price_180
      - price_60
      - price_90
      - start_time
