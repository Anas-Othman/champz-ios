        company_email:
          type: string
          default: ''
          readOnly: true
        company_phone:
          type: string
          default: ''
          readOnly: true
        company_whatsapp:
          type: string
          default: ''
          readOnly: true
        book_of_court_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        friendly_game_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        tournaments_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        is_topup_bonus:
          type: boolean
          readOnly: true
        topup_bonus_percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        is_cash_enable:
          type: boolean
          readOnly: true
        is_apple_pay_enable:
          type: boolean
          readOnly: true
        is_split_payment_enable:
          type: boolean
          readOnly: true
        facebook_url:
          type: string
          default: ''
          readOnly: true
        instagram_url:
          type: string
          default: ''
          readOnly: true
        twitter_url:
          type: string
          default: ''
          readOnly: true
        youtube_url:
          type: string
          default: ''
          readOnly: true
      required:
      - book_of_court_fee
      - company_email
      - company_phone
      - company_whatsapp
      - facebook_url
      - friendly_game_fee
      - instagram_url
      - is_apple_pay_enable
      - is_cash_enable
      - is_split_payment_enable
      - is_topup_bonus
