    RecurringBookingCreate:
      type: object
      description: |-
        Manager-only. ``price_per_reservation`` is the manager's own rate.

        Unlike a player booking, the price is accepted here — a venue manager quoting
        a series rate for their own court is the legitimate case. What stops it being
        an NFR-010 hole is the authorisation check in the service: the caller must
        manage every listed court's venue.
      properties:
        court_ids:
          type: array
          default: []
          items:
            type: string
            default: ''
          minItems: 1
        title:
          type: string
          default: ''
        start_time:
          type: string
          default: ''
          format: time
        end_time:
          type: string
          default: ''
          format: time
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        price_per_reservation:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        recurrence_type:
