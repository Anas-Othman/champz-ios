  /api/v1/wallet/topup/:
    post:
      operationId: wallet_topup_create
      description: |-
        ``POST /wallet/topup/`` — start adding money to your own wallet.

        Hosted checkout. The Apple Pay sheet uses ``POST /payments/sessions/`` with
        ``purpose=wallet_topup`` and the same body — the same resolver, reached
        through the product-specific endpoint.
      summary: Start a wallet top-up
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'Send the same key to retry a checkout safely: the payment already
          started for that key is returned instead of a second one being created.
          Reusing a key for a payment that has already finished is a 400.'
      tags:
      - wallet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopupCreate'
