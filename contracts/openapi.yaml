  /api/v1/payments/{payment_id}/abandon/:
    post:
      operationId: payments_abandon_create
      description: |-
        Returns any wallet money this checkout is holding **immediately**, instead of waiting out the 15-minute window, and writes the checkout off so whatever it was holding — a join, a booking — is freed.

        Call it when the player leaves the payment screen without paying. Safe to call twice; the refund happens once.

        **SkipCash is asked before any money moves**, because a payment can be paid seconds before its webhook arrives. Read `status` on the answer rather than assuming the cancellation took: `failed` means it did and the money is back; `success` means the card cleared after all and nothing was refunded; `pending` means we could not confirm and left everything alone — the 15-minute sweep still has it, so show the player nothing and let your existing polling resolve it.

        A **423** while payments are paused is not a failure to handle loudly — the every-minute sweep still returns the money on the 15-minute window, which is what happened before this endpoint existed. Say nothing to the player and let it land.
      summary: Abandon a checkout the player left
      parameters:
      - in: path
        name: payment_id
        schema:
          type: string
        required: true
      tags:
      - payments
      security:
      - BearerJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '423':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Payments are paused (error.code 02050). Retry-After gives seconds;
            X-Champz-Stack identifies the answering stack.
