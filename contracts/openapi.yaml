  /api/admin/v1/bookings/{booking_id}/:
    get:
      operationId: api_admin_v1_bookings_retrieve
      description: |-
        Replaces `/admin/get_bookings`, `/admin/create_booking`,
        `/admin/update_booking/{id}`, `/admin/delete_booking/{id}`, plus the
        actions the legacy panel never had a working endpoint for at all
        (reschedule, participants replace, cancel-with-refund, refund preview —
        Admin Panel Plan 3, Tasks B1-B5).

        ``?date=YYYY-MM-DD`` is the day schedule the manager's calendar screen
        draws; ``?date_from=&date_to=`` is the range the week view and the
        bookings list use.
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
        description: A unique value identifying this booking.
        required: true
      tags:
      - api
      security:
      - BearerJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
    put:
      operationId: api_admin_v1_bookings_update
      description: |-
        ``PUT`` on the detail route is disabled (T-B3): a whole-object
        replace has no sane meaning for money fields the write serializer
        never accepts, so only ``PATCH`` (``partial=True``) is allowed here.
        The ``participants`` action below has its own ``PUT`` and is unaffected
        — this only guards ``/bookings/{id}/`` itself.
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
        description: A unique value identifying this booking.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBookingUpdate'
      security:
      - BearerJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
