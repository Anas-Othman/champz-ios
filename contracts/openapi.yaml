        Two answers behind one route, because the screen asks two questions about
        the same thing:

        * ``?date=`` returns the 30-minute grid — which starts are free, which are
          taken, and what durations each offers.
        * ``?date=&start=&duration=`` returns the courts that can take that exact
          window, each with its price.

        A holiday is answered with a normal 200 and ``is_holiday: true`` over an
        empty grid. Production answered HTTP 201 with ``status: false``, which is
        neither this API's success shape nor its error shape; the flag carries the
        same information without a third one.
      parameters:
      - in: query
        name: available_only
        schema:
          type: boolean
        description: Return only bookable starts, dropping the booked ones.
      - in: query
        name: date
        schema:
          type: string
        description: YYYY-MM-DD.
        required: true
      - in: query
        name: duration
        schema:
          type: integer
        description: One of [60, 90, 120, 150, 180].
      - in: query
        name: durations
        schema:
          type: string
        description: Comma-separated minutes to test each start against. Defaults
          to the venue's own durations.
      - in: query
        name: start
        schema:
          type: string
        description: HH:MM. With `duration`, switches to the court list for that window.
      - in: path
        name: venue_id
        schema:
          type: string
        required: true
      tags:
      - venues
      security:
      - BearerJWT: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
          description: ''
  /api/v1/venues/{venue_id}/courts/:
    get:
