        name: available_slots
        schema:
          type: string
        description: Comma-separated HH:MM-HH:MM windows. Keeps venues where one court
          is open across at least one whole window.
      - in: query
        name: latitude
        schema:
          type: number
          format: double
        description: Sorts nearest-first when paired with longitude.
      - in: query
        name: longitude
        schema:
          type: number
          format: double
      - in: query
        name: search
        schema:
          type: string
        description: Matches name, location or description.
      - in: query
        name: surface_type
        schema:
          type: string
        description: 'Comma-separated surface chips: indoor, grass, synthetic. Each
          is expanded to every court_type spelling it covers; an unrecognised value
          is matched exactly.'
      tags:
      - venues
      security:
      - BearerJWT: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
