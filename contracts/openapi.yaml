          default: ''
          nullable: true
          readOnly: true
        description:
          type: string
          default: ''
          readOnly: true
        is_featured:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - id
      - image
      - image_url
      - is_featured
      - title
    PostWrite:
