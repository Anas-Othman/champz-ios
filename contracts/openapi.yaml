    Profile:
      type: object
      description: |-
        The signed-in player's own profile.

        ``avatar_url`` is always set: a player who has uploaded nothing gets one of
        the bundled default avatars, assigned when the account was created and stable
        thereafter.

        ``is_available`` says whether the player is open to transfer offers. It is a
        **boolean**, and it defaults to ``false`` — the previous platform accepted the
        value and discarded it, so nobody has one set yet.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        first_name:
          type: string
          default: ''
          readOnly: true
        last_name:
          type: string
          default: ''
          readOnly: true
        full_name:
          type: string
          default: ''
          readOnly: true
        email:
          type: string
          default: ''
          format: email
          readOnly: true
        country_code:
          type: string
          default: ''
          readOnly: true
        phone:
          type: string
          default: ''
          readOnly: true
        avatar_url:
          type: string
          default: ''
          readOnly: true
        gender:
          allOf:
          - $ref: '#/components/schemas/GenderEnum'
          readOnly: true
        date_of_birth:
          type: string
          format: date
          readOnly: true
          nullable: true
        nationality:
          allOf:
          - $ref: '#/components/schemas/Nationality'
          readOnly: true
          nullable: true
        city:
          allOf:
          - $ref: '#/components/schemas/City'
          readOnly: true
          nullable: true
        address:
          type: string
          default: ''
          readOnly: true
        address2:
          type: string
          default: ''
          readOnly: true
        position:
          allOf:
