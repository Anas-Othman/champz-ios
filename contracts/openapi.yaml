          default: ''
          readOnly: true
        court_type:
          type: string
          default: ''
          readOnly: true
        start_time:
          type: string
          default: ''
          format: time
          readOnly: true
          nullable: true
        end_time:
          type: string
          default: ''
          format: time
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
        slots:
