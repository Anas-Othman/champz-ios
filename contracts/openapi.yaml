  /api/v1/payments/skipcash/webhook/:
    post:
      operationId: payments_skipcash_webhook_create
      description: |-
        Called by SkipCash, not by clients. The delivery is HMAC-verified against `SKIPCASH_WEBHOOK_KEY` and then re-confirmed by asking the gateway directly before any money moves (ADR-0015).

