    BookingCreate:
      type: object
      description: |-
        What a player may say when booking a court.

        ``end_time`` is absent on purpose: it is ``start_time + duration``, and
        accepting both invites a request where the two disagree — which legacy
        handled with a normalisation step and a midnight special case rather than by
        removing the ambiguity.
      properties:
        court_id:
          type: string
          default: ''
        date:
          type: string
          format: date
        start_time:
          type: string
          default: ''
          format: time
        duration:
          type: integer
          default: 0
          minimum: 1
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        payment_type:
          $ref: '#/components/schemas/PaymentTypeEnum'
        participants:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/ParticipantWrite'
        private_notes:
          type: string
          default: ''
        public_notes:
          type: string
          default: ''
        booking_name:
          type: string
          default: ''
        booking_email:
          oneOf:
          - type: string
            format: email
            default: ''
          - type: string
            maxLength: 0
        booking_country_code:
          type: string
          default: ''
        booking_phone:
          type: string
          default: ''
        book_type:
          allOf:
          - $ref: '#/components/schemas/BookTypeEnum'
          default: app
      required:
      - court_id
      - date
      - duration
      - participants
      - payment_method
      - start_time
    BookingFromEnum:
      enum:
      - 0
      - 1
      type: integer
      description: |-
        * `0` - Player app
        * `1` - Manager panel
    BookingPaymentStatusEnum:
      enum:
      - paid
      - unpaid
      - partial
      type: string
      description: |-
        * `paid` - Paid
        * `unpaid` - Unpaid
        * `partial` - Partially paid
    BookingStatusEnum:
      enum:
      - 0
      - 1
      type: integer
      description: |-
        * `0` - Cancelled
        * `1` - Active
    ChannelEnum:
      enum:
      - app
      - web
      type: string
      description: |-
        * `app` - app
        * `web` - web
    CheckoutCreate:
      type: object
      description: |-
        Start a hosted checkout.

        ``booking_id`` cannot be unconditionally required — T9's wallet purposes have
        no booking — so it is required *per purpose* in :meth:`validate` instead.
        That keeps the field optional in the schema while making the one request
        shape that matters today impossible to send wrong.

        A purpose with no registered resolver is refused by name here rather than
        deeper in, so the 400 says which purpose and the generated client has one
        documented failure to handle instead of a 500.
      properties:
        purpose:
          $ref: '#/components/schemas/PaymentPurposeEnum'
        booking_id:
          type: string
          default: ''
        recipient_id:
          type: string
          default: ''
        join_request_id:
          type: string
          default: ''
          description: The join request being paid for. Required for the two join
            purposes.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Only for the wallet purposes. Ignored for everything else.
        channel:
          allOf:
          - $ref: '#/components/schemas/ChannelEnum'
          description: |-
            Where the payer came from. Decides where the return leg sends them.

            * `app` - app
            * `web` - web
        use_wallet:
          type: boolean
          default: true
          description: 'The player''s answer to **Use my wallet** for this purchase.
            `false` charges the whole price to the card even when the wallet could
            cover part of it. Absent means `true`, so a client that predates the field
            is unaffected. The platform setting `is_split_payment_enable` still has
            the last word: `true` here does not switch the feature on.'
      required:
      - purpose
    City:
      type: object
      description: A city within one country.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        name:
          type: string
          default: ''
          readOnly: true
      required:
      - id
      - name
    Club:
      type: object
      description: |-
        A club and who captains it.

        ``captain`` is the profile card, reached through ``owner.player_profile`` —
        ``PublicPlayerSerializer`` takes a ``PlayerProfile``, not a ``User``, and a
        captain with no profile row renders as null rather than failing the way
        legacy's ``$voting->player->image`` does.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        name:
          type: string
          default: ''
          maxLength: 255
        image:
          type: string
          default: ''
          maxLength: 500
        location:
          type: string
          default: ''
          maxLength: 255
        captain:
          allOf:
          - $ref: '#/components/schemas/PublicPlayer'
          nullable: true
          readOnly: true
      required:
      - captain
      - id
      - name
    ClubBrief:
      type: object
      description: A club as it appears inside a table row or a fixture.
      properties:
        id:
          type: string
          default: ''
        name:
          type: string
          default: ''
        image:
          type: string
          default: ''
      required:
      - id
      - image
      - name
    ClubCaptain:
      type: object
      description: |-
        Who the club is being handed to.

        The recipient must already be in the club. There is no invitation step and
        no consent step — captaincy gates inviting players and adding free agents,
        nothing that costs the holder anything, and it can be handed straight back.
      properties:
        recipient_id:
          type: string
          default: ''
      required:
      - recipient_id
    CmsPage:
      type: object
      description: |-
        One informational document.

        ``status`` is returned as the legacy 0/1 integer rather than a boolean, and
        it is *not* a filter — see the model. A client that treats a `0` page as
        unpublished is doing more than the server does.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        cms_type:
          allOf:
          - $ref: '#/components/schemas/CmsTypeEnum'
          readOnly: true
        name:
          type: string
          default: ''
          readOnly: true
        description:
          type: string
          default: ''
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CmsPageStatusEnum'
          readOnly: true
          description: |-
            Inactive pages are not served by the public API, so this is safe to use for drafting. Production filtered on nothing and a draft could shadow a live page; that was changed deliberately (champz-docs#60).

            * `1` - Active
            * `0` - Inactive
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cms_type
      - created_at
      - description
      - id
      - name
      - status
    CmsPageStatusEnum:
      enum:
      - 1
      - 0
      type: integer
      description: |-
        * `1` - Active
        * `0` - Inactive
    CmsPageWrite:
      type: object
      properties:
        cms_type:
          $ref: '#/components/schemas/CmsTypeEnum'
        name:
          type: string
          default: ''
          maxLength: 255
        description:
          type: string
          default: ''
        status:
          allOf:
          - $ref: '#/components/schemas/CmsPageStatusEnum'
          description: |-
            Inactive pages are not served by the public API, so this is safe to use for drafting. Production filtered on nothing and a draft could shadow a live page; that was changed deliberately (champz-docs#60).

            * `1` - Active
            * `0` - Inactive
