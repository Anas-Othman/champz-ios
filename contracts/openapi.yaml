        The booking durations this venue sells.

        See ``services.availability.venue_durations`` on where the answer comes from:
        the venue manager's migrated ``settings.court_default_prices``, read with
        production's own key and ``active`` rules (``services.durations``).
      parameters:
      - in: path
        name: venue_id
        schema:
          type: string
        required: true
      tags:
      - venues
