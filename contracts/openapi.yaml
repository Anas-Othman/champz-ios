    Transfer:
      type: object
      description: A completed transfer, and what the sender has left.
      properties:
        reference_id:
          type: string
          default: ''
          readOnly: true
        recipient_id:
          type: string
          default: ''
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          default: ''
          readOnly: true
      required:
      - amount
      - balance
      - currency
      - recipient_id
      - reference_id
    TransferCreate:
      type: object
      description: |-
        Send money to another player.

        There is no sender field, and that is the point. Legacy's ``transfer_amount``
        reads ``user_id`` from the body and debits whatever wallet it names, behind a
        middleware that only logs (DD BE-02, BE-04/05). Here the sender is the token
        holder and the request has no way to say otherwise.
      properties:
        recipient_id:
          type: string
          default: ''
          description: The player receiving the money.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - amount
      - recipient_id
    TransferMarketPlayer:
      type: object
      description: |-
        A market card: the public player card, whether they captain a club, and
        their goals and matches played.

        ``goals`` and ``matches_played`` are legacy's ``total_goals`` and
        ``total_matches``, which both market payloads carried on every card.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        full_name:
          type: string
          default: ''
          readOnly: true
        avatar_url:
          type: string
          default: ''
          readOnly: true
        gender:
          allOf:
          - $ref: '#/components/schemas/GenderEnum'
          readOnly: true
        date_of_birth:
          type: string
          format: date
          readOnly: true
          nullable: true
        nationality:
          allOf:
          - $ref: '#/components/schemas/Nationality'
          readOnly: true
          nullable: true
        city:
          allOf:
          - $ref: '#/components/schemas/City'
          readOnly: true
          nullable: true
        position:
          allOf:
          - $ref: '#/components/schemas/Position'
          readOnly: true
          nullable: true
        traits:
          type: string
          default: ''
          readOnly: true
        height:
          type: string
          default: ''
          readOnly: true
        is_available:
          type: boolean
          readOnly: true
          description: Player is open to transfer offers. Shown as the dot on their
            card.
        club_name:
          type: string
          default: ''
          readOnly: true
          nullable: true
        debut:
          type: string
          format: date-time
          readOnly: true
        is_captain:
          type: boolean
          readOnly: true
        goals:
          type: integer
          default: 0
          readOnly: true
        matches_played:
          type: integer
          default: 0
          readOnly: true
      required:
      - avatar_url
      - city
      - club_name
      - date_of_birth
      - debut
      - full_name
      - gender
      - goals
      - height
      - id
      - is_available
      - is_captain
      - matches_played
      - nationality
      - position
      - traits
    TransferOffer:
      type: object
      description: |-
        A contract offer.

        An offer **is** a notification row — legacy has no offer table and neither
        does this — so ``id`` is the same id the notifications feed returns, and
        ``status`` is ``0`` pending / ``1`` accepted / ``2`` declined.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        player_id:
          type: string
          default: ''
          readOnly: true
        club_id:
          type: string
          default: ''
          nullable: true
          readOnly: true
        tournament_id:
          type: string
          default: ''
          nullable: true
          readOnly: true
        actor_id:
          type: string
          default: ''
          nullable: true
          readOnly: true
        notify_type:
          allOf:
          - $ref: '#/components/schemas/NotifyTypeEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/NotificationStatusEnum'
          readOnly: true
        title:
          type: string
          default: ''
          readOnly: true
        message:
          type: string
          default: ''
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        checkout:
          allOf:
          - $ref: '#/components/schemas/SquadPlaceCheckout'
          nullable: true
          readOnly: true
      required:
      - actor_id
      - checkout
      - club_id
      - created_at
      - id
      - message
      - notify_type
      - player_id
      - status
      - title
      - tournament_id
    TransferOfferActionEnum:
      enum:
      - accept
      - decline
      type: string
      description: |-
        * `accept` - Accept
        * `decline` - Decline
    TransferOfferCreate:
      type: object
      description: |-
        Body of ``POST /transfer-market/offers/``.

        **No sender id.** Legacy takes ``login_user_id`` and ``team_id`` from the
        body with no ownership check (``:557-563``), so anyone could offer on behalf
        of any club. The sender is the bearer token; ``club_id`` must name a club
        they captain.
      properties:
        player_id:
          type: string
          default: ''
          maxLength: 26
        club_id:
          type: string
          default: ''
          maxLength: 26
        tournament_id:
          type: string
          default: ''
          nullable: true
          maxLength: 26
      required:
      - club_id
      - player_id
    TransferOfferRespond:
      type: object
      description: |-
        Body of ``POST /transfer-market/offers/{id}/respond/``.

        One field, deliberately. Legacy's ``updateNotificationStatus`` also accepted
        ``payment_status`` and wrote it straight to ``join_request`` (``:982``) —
        marking a tournament join paid with no money, on a route that authenticates
        nothing. There is no such field here and none may be added.
      properties:
        action:
          $ref: '#/components/schemas/TransferOfferActionEnum'
      required:
      - action
    TransferRecord:
      type: object
      description: One move between clubs.
      properties:
        transferred_from:
          type: string
          default: ''
          readOnly: true
          nullable: true
        transferred_to:
          type: string
          default: ''
          readOnly: true
          nullable: true
        date:
          type: string
          default: ''
          readOnly: true
          nullable: true
      required:
      - date
      - transferred_from
      - transferred_to
    UnreadCount:
      type: object
      properties:
        unread_count:
          type: integer
          default: 0
      required:
      - unread_count
    User:
      type: object
      description: The account behind a token, whichever audience it belongs to.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        user_type:
          allOf:
          - $ref: '#/components/schemas/UserTypeEnum'
          readOnly: true
        first_name:
          type: string
          default: ''
          readOnly: true
        last_name:
          type: string
          default: ''
          readOnly: true
        full_name:
          type: string
          default: ''
          readOnly: true
        email:
          type: string
          default: ''
          format: email
          readOnly: true
          nullable: true
        country_code:
          type: string
          default: ''
          readOnly: true
        phone:
          type: string
          default: ''
          readOnly: true
        role:
          type: string
          default: ''
          readOnly: true
        permissions:
          type: array
          default: []
          items:
            type: string
            default: ''
          description: |-
            Staff only: every ``app_label.codename`` the account holds, sorted.

            The Admin Panel gates its navigation on these (ADR-0021, ADR-0028). A
            superuser gets the full list rather than a wildcard so the panel needs
            no special case; players get an empty list because the permission layer
            is a staff concern (``HasAdminPermission`` refuses them before it looks).
          readOnly: true
        sections:
          type: object
          additionalProperties:
            type: array
            default: []
            items:
              type: string
              default: ''
          description: |-
            The panel's own grant: ``{section: [actions]}``, what the sidebar gates on.

            Read from the account's marker permissions only (ADR-0021 +
            ``apps.core.panel_sections``). The panel used to infer its menus from the
            model permissions, which overlap between screens — a role granted
            Tournaments got the Groups and Statistics entries it was never given.
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
          description: Can sign in to the Django admin.
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        wallet_balance:
          type: string
          default: ''
          nullable: true
          description: |-
            Players only; staff have no player wallet, so the key is null for them.

            Derived from the ledger rather than read off a column — there is no
            column (see the note in ``apps.users.models.PlayerProfile``). A player
            who has never had money moved has no wallet row yet and reads "0.00",
            which is the same wire value the column's default produced.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - country_code
      - created_at
      - email
      - first_name
      - full_name
      - id
      - is_active
      - is_staff
      - is_superuser
      - last_name
      - permissions
      - phone
      - role
      - sections
      - user_type
      - wallet_balance
    UserTypeEnum:
      enum:
      - staff
      - player
      type: string
      description: |-
        * `staff` - Staff
        * `player` - Player
    Venue:
      type: object
      description: |-
        A venue card: what it is, what it looks like, and what is on it.

        ``distance_km`` appears only when the request carried coordinates — it is an
        annotation on the queryset, not a column, and a venue with no coordinates
        keeps it null.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        name:
          type: string
          default: ''
          readOnly: true
        location:
          type: string
          default: ''
          readOnly: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          readOnly: true
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          readOnly: true
          nullable: true
        distance_km:
          type: number
          default: 0
          format: double
          readOnly: true
          nullable: true
        capacity:
          type: integer
          default: 0
          readOnly: true
          description: Number of spectators the ground can accommodate.
        surface_type:
          type: string
          default: ''
          readOnly: true
        availability:
          type: boolean
          readOnly: true
        is_champz_venue:
          type: boolean
          readOnly: true
        equipment:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/EquipmentEnum'
          - $ref: '#/components/schemas/NullEnum'
        equipment_label:
          type: string
          default: ''
          readOnly: true
        is_parking:
          allOf:
          - $ref: '#/components/schemas/IsParkingEnum'
          readOnly: true
        parking_label:
          type: string
          default: ''
          readOnly: true
        no_of_courts:
          type: integer
          default: 0
          readOnly: true
          nullable: true
        contact_number:
          type: string
          default: ''
          readOnly: true
        description:
          type: string
          default: ''
          readOnly: true
        timezone:
          type: string
          default: ''
          readOnly: true
        sport_id:
          type: string
          default: ''
          readOnly: true
          nullable: true
        image_url:
          type: string
          default: ''
          nullable: true
          readOnly: true
        images:
          type: array
          default: []
          items:
            type: string
            default: ''
          readOnly: true
        courts:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/Court'
          readOnly: true
      required:
      - availability
      - capacity
      - contact_number
      - courts
      - description
      - distance_km
      - equipment
      - equipment_label
      - id
      - image_url
      - images
      - is_champz_venue
      - is_parking
      - latitude
      - location
      - longitude
      - name
      - no_of_courts
      - parking_label
      - sport_id
      - surface_type
      - timezone
    VenueDurations:
      type: object
      properties:
        durations:
          type: array
          default: []
          items:
            type: integer
            default: 0
          readOnly: true
      required:
      - durations
    VenueHours:
      type: object
      description: |-
        The venue's outer opening hours, for positioning the time picker.

        Null on both when the venue has no courts with hours set — the picker then
        falls back to its own defaults rather than showing a bogus window.
      properties:
        start_time:
          type: string
          default: ''
          format: time
          readOnly: true
          nullable: true
        end_time:
          type: string
          default: ''
          format: time
          readOnly: true
          nullable: true
      required:
      - end_time
      - start_time
    VenueManager:
      type: object
      description: Schema shape for :meth:`AdminVenueSerializer.get_managers`.
      properties:
        id:
          type: string
          default: ''
        email:
          type: string
          default: ''
          format: email
        full_name:
          type: string
          default: ''
      required:
      - email
      - full_name
      - id
    VenueSummary:
      type: object
      description: |-
        The venue header that rides along with an availability response.

        Deliberately thin: the availability screen has already shown the card, and
        repeating the courts inside a response that is *about* courts would be
        confusing as well as large. Production sends exactly these fields.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        name:
          type: string
          default: ''
          readOnly: true
        location:
          type: string
          default: ''
          readOnly: true
        contact_number:
          type: string
          default: ''
          readOnly: true
        image_url:
          type: string
          default: ''
          nullable: true
          readOnly: true
        images:
          type: array
          default: []
          items:
            type: string
            default: ''
          readOnly: true
      required:
      - contact_number
      - id
      - image_url
      - images
      - location
      - name
    VerifyOtp:
      type: object
      description: Identifier plus the code. Purpose is read off the row, not sent.
      properties:
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone:
          type: string
          default: ''
          maxLength: 20
        country_code:
          type: string
          default: ''
          maxLength: 8
        otp:
          type: string
          default: ''
          maxLength: 6
          minLength: 6
      required:
      - otp
    WaitingListEntry:
      type: object
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        player_id:
          type: string
          default: ''
          readOnly: true
        name:
          type: string
          default: ''
          readOnly: true
        position:
          type: integer
          default: 0
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - player_id
      - position
    WalletAdjust:
      type: object
      properties:
        player_id:
          type: string
          default: ''
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        direction:
          $ref: '#/components/schemas/DirectionEnum'
        reason:
          type: string
          default: ''
          maxLength: 1000
      required:
      - amount
      - direction
      - player_id
      - reason
    WalletBalance:
      type: object
      description: A player's wallet balance and the currency it is held in.
      properties:
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          default: ''
          readOnly: true
      required:
      - balance
      - currency
    WalletPayMethodEnum:
      enum:
      - apple_pay
      - google_pay
      type: string
      description: |-
        * `apple_pay` - Apple Pay
        * `google_pay` - Google Pay
    WebhookAck:
      type: object
      description: |-
        What the gateway gets back.

        ``{"status": "ok"}`` is legacy's body, kept verbatim: SkipCash's retry
        behaviour is driven by the status code, but a webhook consumer that changes
        its response body is a change nobody can test from our side.
      properties:
        status:
          type: string
          default: ''
      required:
      - status
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from /api/v1/auth/token/. The `user_type` claim selects
        the identity: `staff` or `app`.'
