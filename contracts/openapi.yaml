        target_id:
          type: string
          default: ''
          readOnly: true
        url:
          type: string
          default: ''
          readOnly: true
        web_url:
          type: string
          default: ''
          readOnly: true
        web_path:
          type: string
          default: ''
          readOnly: true
        app_params:
          type: object
          additionalProperties:
            type: string
            default: ''
          description: What the installed client reads off the URL. Empty for most
            types.
          readOnly: true
        extra:
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
