          readOnly: true
          nullable: true
        traits:
          type: string
          default: ''
          readOnly: true
        height:
          type: string
          default: ''
          readOnly: true
        is_available:
          type: boolean
          readOnly: true
          description: Player is open to transfer offers. Shown as the dot on their
            card.
        is_profile_complete:
          type: boolean
          readOnly: true
        club_name:
          type: string
          default: ''
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - address2
      - avatar_url
      - city
      - club_name
      - country_code
      - created_at
      - date_of_birth
      - email
      - first_name
      - full_name
      - gender
      - height
      - id
      - is_available
      - is_profile_complete
      - last_name
      - nationality
      - phone
      - position
      - traits
    ProfileDelete:
      type: object
      description: |-
        How to deal with the wallet balance while deleting the account.

        Both fields are conditional rather than required, and the condition is the
        balance:

        * a **zero** balance needs neither — send an empty body;
        * a **non-zero** balance needs `balance_disposition`, or the answer is
          `400 BALANCE_DISPOSITION_REQUIRED`;
        * `transfer` additionally needs `recipient_id`, and an `Idempotency-Key`
          header, because it moves money through the same path as any other wallet
          transfer.

        `keep` leaves the balance where it is: recoverable by signing in again inside
        the reactivation window, and swept to Champz after it.

        There is no `user_id` here and there never will be. The account deleted is
        the one the bearer token belongs to — legacy took `user_id` from this body on
        a route whose middleware only logged, so anyone could delete anyone
        (DD BE-02/BE-05).
      properties:
        balance_disposition:
          $ref: '#/components/schemas/BalanceDispositionEnum'
        recipient_id:
          type: string
          default: ''
    ProfileDeletionState:
      type: object
      description: |-
        What would happen if the caller deleted their account right now.

        Call this before showing the delete button. `can_delete` false means
        `blockers` is non-empty and the DELETE would answer 409; a non-zero
        `wallet_balance` means the DELETE needs a `balance_disposition`.

        `reactivation_window_days` is how long signing in on the same phone can still
        restore the account. After that it is removed and any balance left goes to
        Champz, so this is the number the confirmation screen has to say out loud.
      properties:
        can_delete:
          type: boolean
        blockers:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/DeletionBlocker'
        wallet_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        currency:
          type: string
          default: ''
        reactivation_window_days:
          type: integer
          default: 0
      required:
      - blockers
      - can_delete
      - currency
      - reactivation_window_days
      - wallet_balance
    PublicPlayer:
      type: object
      description: |-
        A player as everyone else sees them — the transfer-market card.

        Carries **no** contact details. A player reads their own email and phone from
        the profile endpoint; this route is readable by any signed-in user, so those
        fields are not on it.

        ``is_available`` *is* here, and has to be: it is a signal the player chose to
        publish, and the dot on this card is what it exists to draw.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        full_name:
          type: string
          default: ''
          readOnly: true
        avatar_url:
          type: string
          default: ''
          readOnly: true
        gender:
          allOf:
          - $ref: '#/components/schemas/GenderEnum'
          readOnly: true
        date_of_birth:
          type: string
          format: date
          readOnly: true
          nullable: true
        nationality:
          allOf:
          - $ref: '#/components/schemas/Nationality'
          readOnly: true
          nullable: true
        city:
          allOf:
          - $ref: '#/components/schemas/City'
          readOnly: true
          nullable: true
        position:
          allOf:
          - $ref: '#/components/schemas/Position'
          readOnly: true
          nullable: true
        traits:
          type: string
          default: ''
          readOnly: true
        height:
          type: string
          default: ''
          readOnly: true
        is_available:
          type: boolean
          readOnly: true
          description: Player is open to transfer offers. Shown as the dot on their
            card.
        club_name:
          type: string
          default: ''
          readOnly: true
          nullable: true
        debut:
          type: string
          format: date-time
          readOnly: true
      required:
      - avatar_url
      - city
      - club_name
      - date_of_birth
      - debut
      - full_name
      - gender
      - height
      - id
      - is_available
      - nationality
      - position
      - traits
    ReasonEnum:
      enum:
      - match_fee
      - t_service_fee
      - bc_service_fee
      - fg_service_fee
      - book_court
      - commission
      - refund
      - settlement
      - topup
      - topup_bonus
      - transfer
      - legacy_import
      - account_closure
      - unclaimed_credit
      - admin_adjustment
      - opening_floor
      - opening_alignment
