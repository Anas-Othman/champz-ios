    AppConfig:
      type: object
      description: |-
        The app's own configuration: contact details, service fees, toggles.

        This is legacy's ``get-organizer-details`` (``v1/MatchController.php:3102``
        → ``Common.php:4165-4183``), whose name is a misnomer — it has nothing to do
        with organizers. **The keys are legacy's**, all fourteen of them and no more,
        so that the ETL, the React panel and anyone comparing the two responses do
        not need a translation table.

        Two deliberate departures from the legacy response, both recorded because
        they are visible to a client:

        * **Flags are booleans, not ``0``/``1``.** Legacy sends the raw
          ``tinyInteger``, and the current Flutter build declares
          ``int? isCashEnable = json["is_cash_enable"] ?? 0``, so it will fail to
          parse a boolean. That is the same class of break as ADR-0005's string ids,
          which this surface already forces on the client, and M1 (champz-docs#26)
          regenerates it. Sending ``1`` where the value means "yes" would carry
          legacy's 1/2-versus-0/1 confusion into a fresh contract.
        * **Values are country-scoped**, resolved through
          ``AdminSetting.objects.for_country``. Legacy reads a single global row
          (``AdminSettings::select(...)->first()``), which is the same thing while
          exactly one country is active and the right shape once a second is
          (ADR-0011).

        ``online_payment_gateway_charges`` is registered but **absent here**, because
        it is absent from the legacy response. It is a server-side input to what a
        payment costs, and a client has no use for it.
