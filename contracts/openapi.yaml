  /api/admin/v1/auth/password-reset/:
    post:
      operationId: api_admin_v1_auth_password_reset_create
      description: |-
        ``POST`` ask for a reset link.

        **Always 202, whether or not the address exists.** Answering 404 for an
        unknown address would turn this into a staff-directory oracle, and the staff
        directory is precisely what an attacker wants before phishing. The service
        logs the miss so support can still answer "I never got the email".
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
          description: ''
  /api/admin/v1/auth/password-reset/confirm/:
    post:
      operationId: api_admin_v1_auth_password_reset_confirm_create
      description: '``POST`` set a new password against a token from the emailed link.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
          description: ''
