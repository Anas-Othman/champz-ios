        * `female` - Female
        * `other` - Other
    GoalBoard:
      type: object
      description: |-
        The goal-of-the-week screen in one response.

        ``goals`` is this week's contest, falling back to last week's when no window
        is open, so the screen is never empty between contests. ``leaderboard`` is an
        **addition**: legacy computes it but the mobile controller drops it, and only
        the web panel ever returned it.
      properties:
        week_start:
          type: string
          format: date
          readOnly: true
        week_end:
          type: string
          format: date
          readOnly: true
        total_players:
          type: integer
          default: 0
          readOnly: true
        has_voted:
          type: boolean
          readOnly: true
        goals:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/GoalCard'
          readOnly: true
        previous_week_winner:
          allOf:
          - $ref: '#/components/schemas/GoalCard'
          readOnly: true
          nullable: true
        leaderboard:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/LeaderboardPlace'
          readOnly: true
      required:
      - goals
      - has_voted
      - leaderboard
      - previous_week_winner
      - total_players
      - week_end
      - week_start
    GoalCard:
      type: object
      description: |-
        One clip on the board.

        Renamed from legacy's keys where they were actively misleading: ``name`` meant
        the *tournament's* name, ``file`` the video, ``is_vote`` a boolean expressed
        as 0/1.

        ⚠️ **Note for mobile:** ``percentage_votes`` is this clip's share of the
        week's votes, which is what the server has always computed
        (``Common.php:3736``). The current build ignores it and recomputes
        ``ceil(votes / total_players)`` instead
        (``video_player_controller.dart:627-637``), so the two disagree on screen
        today. ``has_voted`` is also now a JSON boolean where the hand-written model
        reads an int.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        tournament_name:
          type: string
          default: ''
          readOnly: true
          nullable: true
        club_id:
          type: string
          default: ''
          readOnly: true
          nullable: true
        club_name:
          type: string
          default: ''
          readOnly: true
          nullable: true
        player:
          allOf:
          - $ref: '#/components/schemas/GoalPlayer'
          readOnly: true
          nullable: true
        video_url:
          type: string
          default: ''
          readOnly: true
        thumbnail_url:
          type: string
          default: ''
          readOnly: true
        voting_opens_on:
          type: string
          format: date
          readOnly: true
          nullable: true
        voting_closes_on:
          type: string
          format: date
          readOnly: true
          nullable: true
        total_votes:
          type: integer
          default: 0
          readOnly: true
        percentage_votes:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        has_voted:
          type: boolean
          readOnly: true
      required:
      - club_id
      - club_name
      - has_voted
      - id
      - percentage_votes
      - player
      - thumbnail_url
      - total_votes
      - tournament_name
      - video_url
      - voting_closes_on
      - voting_opens_on
    GoalPlayer:
      type: object
      description: |-
        Whose goal it is, as the card shows them.

        Flattened in legacy into ``player_name`` / ``player_position`` /
        ``player_image`` (``Common.php:3739-3741``). Nested here so the whole object
        can be ``null`` when the clip has no resolvable scorer, rather than three
        fields that are separately null — and so the client cannot null-dereference
        the way ``getVotingList`` does with ``$voting->player->image``.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        full_name:
          type: string
          default: ''
          readOnly: true
        position:
          type: string
          default: ''
          readOnly: true
          nullable: true
        avatar_url:
          type: string
          default: ''
          readOnly: true
      required:
      - avatar_url
      - full_name
      - id
      - position
    GoalVoteResult:
      type: object
      description: 'What a vote answers with: the clip''s new standing.'
      properties:
        goal_id:
          type: string
          default: ''
          readOnly: true
        status:
          type: integer
          default: 0
          readOnly: true
        total_votes:
          type: integer
          default: 0
          readOnly: true
        percentage_votes:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - goal_id
      - percentage_votes
      - status
      - total_votes
    GoalVoteWrite:
      type: object
      description: |-
        Body of ``PUT /goals-of-the-week/{goal_id}/vote/``.

        **No ``user_id`` and no ``goal_of_the_week_id``**: the voter is the bearer
        token and the clip is in the path. Legacy took both from the body on a route
        that authenticates nothing, so anyone could vote as anyone
        (``v1/TournamentController.php:1233-1240``).

        ``status`` keeps legacy's 0/1 because that is what the installed client
        sends — ``0`` withdraws, which is how a player frees their one vote for the
        week to pick a different clip.
      properties:
        status:
          $ref: '#/components/schemas/GoalVoteWriteStatusEnum'
      required:
      - status
    GoalVoteWriteStatusEnum:
      enum:
      - 0
      - 1
      type: integer
      description: |-
        * `0` - Withdrawn
        * `1` - Cast
    GoalVoter:
      type: object
      description: |-
        One voter on the list — legacy ``getVotingList``.

        ``player`` is a nested object rather than three flattened fields so it can be
        ``null`` as a whole. Legacy renders ``$voting->player->image`` (``:1290``),
        which is a null-property access when the voter has no ``players`` row.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        player:
          allOf:
          - $ref: '#/components/schemas/GoalPlayer'
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - player
    GroundBrief:
      type: object
      description: |-
        The venue, inside the tournament that is played on it.

        The same five columns legacy eager-loads on the detail route
        (``TournamentController.php:2000``: ``id, name, surface_type as pitch,
        latitude, longitude, location``) and no more — the venue card is its own
        screen. The coordinates are what the map widget needs and both are nullable,
        because a fair number of production venues have neither.

        One shape for both routes: the list nests this too, so a tournament card
        prints the venue without a second call per row.
      properties:
        id:
          type: string
          default: ''
        name:
          type: string
          default: ''
        location:
          type: string
          default: ''
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          nullable: true
        surface_type:
          type: string
          default: ''
      required:
      - id
      - latitude
      - location
      - longitude
      - name
      - surface_type
    GroundWrite:
