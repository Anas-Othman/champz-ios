  /api/admin/v1/accolades/:
    get:
      operationId: api_admin_v1_accolades_list
      description: |-
        Player accolades — the awards list on a profile.

        **Nothing wrote this table in production.** T18 found no controller, no admin
        action, no route and no seeder: whatever rows exist were typed into the
        database by hand. So this is not a port of an admin screen, it is the first
        writer the table has ever had — which is why it exists at all, and why the
        panel has no screen for it yet.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - BearerJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminAccoladeList'
          description: ''
