    MatchKindEnum:
      enum:
      - 1
      - 2
      type: integer
      description: |-
        * `1` - Competitive
        * `2` - Friendly
    MatchSlot:
      type: object
      description: One occupied slot. ``player_id`` or ``guest_id`` is set, never
        both.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        player_id:
          type: string
          default: ''
          nullable: true
          readOnly: true
        guest_id:
          type: string
          default: ''
          nullable: true
          readOnly: true
        name:
          type: string
          default: ''
          readOnly: true
        image:
          type: string
          default: ''
          readOnly: true
        position:
          type: string
          default: ''
          readOnly: true
        is_guest:
          type: boolean
          readOnly: true
        ordering:
          type: integer
          default: 0
          readOnly: true
        goals:
          type: integer
          default: 0
          readOnly: true
        paid_by:
          type: string
          default: ''
          readOnly: true
          nullable: true
      required:
      - goals
      - guest_id
      - id
      - image
      - is_guest
      - name
      - ordering
      - paid_by
      - player_id
      - position
    MatchStatusEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `0` - Scheduled
        * `1` - Live
        * `2` - Completed
        * `3` - Cancelled
    MatchTeamTypeEnum:
      enum:
      - 2
      - 3
      - 6
      type: integer
      description: |-
        * `2` - Two teams
        * `3` - Three teams
        * `6` - Six teams (round robin)
    MatchTypeEnum:
      enum:
      - 0
      - 1
      type: integer
      description: |-
        * `0` - Tournament fixture
        * `1` - Friendly game
    Nationality:
      type: object
      description: |-
        A country as the nationality picker shows it.

        ``nationality`` is the label ("Qatari"); ``name`` is the country ("Qatar").
        This is not the list of countries Champz operates in, and not only those:
        where a player is from is unrelated to where the platform runs.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        code:
          type: string
          default: ''
          readOnly: true
          description: ISO-3166-1 alpha-2, uppercase.
        name:
          type: string
          default: ''
          readOnly: true
        nationality:
          type: string
          default: ''
          readOnly: true
        flag_url:
          type: string
          format: uri
          readOnly: true
      required:
      - code
      - flag_url
      - id
      - name
      - nationality
    NextRound:
      type: object
      description: |-
        What the draw produced, or why it produced nothing.

        ``manual`` and ``tie`` are outcomes rather than errors — a 12-team round one
        and a level two-legged knockout both need a person to decide — so they ride
        in the payload with a 200, as legacy does.
      properties:
        round_number:
          type: integer
          default: 0
        already_drawn:
          type: boolean
        manual:
          type: boolean
        tie:
          type: boolean
        fixtures:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/Fixture'
      required:
      - already_drawn
      - fixtures
      - manual
      - round_number
      - tie
    Notification:
      type: object
      description: |-
        One feed item.

        The legacy list returned the raw ``notifications`` row (ints for
        ``notify_type``/``read``/``status``, integer reference ids). Here ids are
        ULID strings (ADR-0005) and ``is_read`` is a boolean; ``notify_type`` and
        ``status`` keep their integer codes because the installed client switches on
        them.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        title:
          type: string
          default: ''
          readOnly: true
        message:
          type: string
          default: ''
          readOnly: true
        notify_type:
          $ref: '#/components/schemas/NotifyTypeEnum'
        status:
          $ref: '#/components/schemas/NotificationStatusEnum'
        is_read:
          type: boolean
          readOnly: true
        payment_status:
          type: string
          default: ''
          readOnly: true
        joining_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        is_from_invitation:
          type: boolean
          readOnly: true
        description:
          type: string
          default: ''
          readOnly: true
        tournament_id:
          type: string
          default: ''
          readOnly: true
          nullable: true
        club_id:
          type: string
          default: ''
          readOnly: true
          nullable: true
        booking_id:
          type: string
          default: ''
          readOnly: true
          nullable: true
        join_request_id:
          type: string
          default: ''
          readOnly: true
          nullable: true
        match_id:
          type: string
          default: ''
          readOnly: true
          nullable: true
        actor_id:
          type: string
          default: ''
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor_id
      - booking_id
      - club_id
      - created_at
      - description
      - id
      - is_from_invitation
      - is_read
      - join_request_id
      - joining_fee
      - match_id
      - message
      - notify_type
      - payment_status
      - status
      - title
      - tournament_id
    NotificationStatusEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `0` - Actionable
        * `1` - Accepted
        * `2` - Declined
        * `3` - Informational
    NotifyTypeEnum:
      enum:
      - 0
      - 1
      - 2
      - 4
      - 5
