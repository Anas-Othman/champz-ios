    AdminRecurringBookingCreate:
      type: object
      description: |-
        `POST /api/admin/v1/recurring-bookings/`.

        `title` is optional, as on the player-facing `RecurringBookingCreateSerializer`:
        the legacy form never asked for one (D-52), the model defaults it to "", and
        the manager Schedule modal sends none (regression SCH-04, 2026-09-26). The
        series must have an end somewhere: either `end_date` or
        `custom_recurrence.endAfterNReservations` (legacy required `end_date`
        outright; this widens it by the one field the model already understands).

        Authorisation (every listed court's venue must be managed by the caller) is
        `RecurringBookingService._assert_manages`'s job, not this serializer's — it
        raises the same `NotYourVenue` (403) whether the caller came from here or
        from `/api/v1/recurring-bookings/`, so the two surfaces cannot drift on it.
      properties:
        title:
          type: string
          default: ''
          maxLength: 255
        courts:
          type: array
          default: []
          items:
            type: string
            default: ''
          minItems: 1
        start_time:
          type: string
          default: ''
          format: time
        end_time:
          type: string
          default: ''
          format: time
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        price_per_reservation:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        recurrence_type:
          $ref: '#/components/schemas/RecurrenceTypeEnum'
        custom_recurrence:
          nullable: true
        payment_type:
          allOf:
          - $ref: '#/components/schemas/PaymentTypeEnum'
          default: single
        participants:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/AdminRecurringParticipantWrite'
        private_notes:
          type: string
          default: ''
        public_notes:
          type: string
          default: ''
      required:
      - courts
      - end_time
      - participants
      - price_per_reservation
      - recurrence_type
      - start_date
      - start_time
