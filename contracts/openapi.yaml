    Home:
      type: object
      description: |-
        The payload the app's home screen opens on.

        Every collection is real and every item is typed — model them from this
        contract.

        ``upcoming_matches`` is every open friendly game, soonest first, in exactly
        the shape ``GET /games/`` returns: the row's "View all" opens that list, so
        the cards are the same cards and the client models one type for both.
        ``join_status`` is the marker for a game the caller is already on and
        ``is_join_waiting_list`` for one they are waiting for; neither removes a
        game from the list. Court bookings are **not** here — they are on
        ``GET /bookings/`` (OD-30).

        ``tournaments`` is production's carousel — approved, non-WSO, not yet
        ended, by start date, four at most — in the same shape as
        ``GET /tournaments/`` items. Both rules are in
        ``apps.players.services.home``.

        ``posts`` carries at most four entries — production's limit, and production's
        only selection rule. See ``apps.players.views.HOME_POST_LIMIT``.
      properties:
        player:
          allOf:
          - $ref: '#/components/schemas/PublicPlayer'
          readOnly: true
        wallet_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          default: ''
          readOnly: true
        upcoming_matches:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/Match'
          readOnly: true
        tournaments:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/Tournament'
          readOnly: true
        banners:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/Banner'
          readOnly: true
        posts:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/Post'
          readOnly: true
      required:
      - banners
      - currency
      - player
      - posts
      - tournaments
      - upcoming_matches
      - wallet_balance
