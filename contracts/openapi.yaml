            reads as pending.
    DeepLink:
      type: object
      description: |-
        A minted link.

        ``url`` is the ``/dl/{token}`` address to share; ``web_url`` is where it
        lands. Both are returned because they are used in different places — the
        first goes in a share sheet, the second is what a preview shows.
      properties:
        token:
          type: string
          default: ''
          readOnly: true
        link_type:
