            $ref: '#/components/schemas/TeamScoreWrite'
        status:
          $ref: '#/components/schemas/MatchStatusEnum'
      required:
      - team_scores
    SendPaymentReminder:
      type: object
      properties:
        booking_id:
          type: string
          default: ''
      required:
      - booking_id
    SessionCreate:
      type: object
      description: |-
        Start an SDK session for a device wallet: Apple Pay (iOS) or Google Pay (Android).

        ``payment_method`` defaults to ``apple_pay`` so the iOS client that predates
        the field keeps working unchanged.
      properties:
        purpose:
          $ref: '#/components/schemas/PaymentPurposeEnum'
        booking_id:
          type: string
          default: ''
        recipient_id:
          type: string
          default: ''
        join_request_id:
          type: string
          default: ''
          description: The join request being paid for. Required for the two join
            purposes.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Only for the wallet purposes. Ignored for everything else.
        channel:
          allOf:
          - $ref: '#/components/schemas/ChannelEnum'
          description: |-
            Where the payer came from. Decides where the return leg sends them.

            * `app` - app
            * `web` - web
        use_wallet:
          type: boolean
          default: true
          description: 'The player''s answer to **Use my wallet** for this purchase.
            `false` charges the whole price to the card even when the wallet could
            cover part of it. Absent means `true`, so a client that predates the field
            is unaffected. The platform setting `is_split_payment_enable` still has
            the last word: `true` here does not switch the feature on.'
        payment_method:
          allOf:
          - $ref: '#/components/schemas/WalletPayMethodEnum'
          default: apple_pay
          description: |-
            Which wallet sheet the device will show: `apple_pay` (iOS) or `google_pay` (Android).

            * `apple_pay` - Apple Pay
            * `google_pay` - Google Pay
        expires_in:
          description: How long the session should live, e.g. `15min` or `2h`.
          oneOf:
          - type: string
            pattern: ^\d+(min|h)$
          - type: string
            maxLength: 0
      required:
      - purpose
    SignupRequest:
      type: object
      description: Signup also captures the profile, so verification is uniform across
        flows.
      properties:
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone:
          type: string
          default: ''
          maxLength: 20
        country_code:
          type: string
          default: ''
          maxLength: 8
        first_name:
          type: string
          default: ''
          maxLength: 255
        last_name:
          type: string
          default: ''
          maxLength: 255
        device_token:
          type: string
          default: ''
          maxLength: 255
    SkipcashWebhook:
      type: object
      description: |-
        What SkipCash posts. Documented, not trusted.

        Declared so the contract describes the whole inbound surface — the field
        names the trust model reads, and the header the signature arrives in. Nothing
        validates a delivery against this: the signature check decides whether the
        body is worth reading (ADR-0015), and `webhooks.Delivery.parse` is what reads
        it. It is here because "contract-first" has to cover the endpoint that moves
        money without a token, and because Postman needs a body to send.

        ⚠️ Which of these fields the signature actually covers is still unconfirmed —
        see `WEBHOOK_SIGNED_FIELDS` and the observe-mode note in ADR-0015.
      properties:
        TransactionId:
          type: string
          default: ''
          description: '**Our** payment id, echoed back — not the gateway''s.'
        PaymentId:
          type: string
          default: ''
          description: SkipCash's own payment id.
        StatusId:
          type: integer
          default: 0
          description: 2 is paid; 3, 4 and 5 are terminal failures; anything else
            is recorded only.
        Custom1:
          type: string
          default: ''
          description: The purpose token we sent (`court_booking`, `topup`, ...).
        Custom2:
          type: string
          default: ''
        Custom3:
          type: string
          default: ''
          description: '`app` or `web`.'
        Amount:
          type: string
          default: ''
          description: Cross-checked against the amount we recorded.
      required:
      - PaymentId
      - StatusId
      - TransactionId
    Slot:
      type: object
      description: |-
        One 30-minute start on the booking grid.

        ``available_durations`` says what can be booked from this start. It is
        filled for booked starts too — the screen greys those out but still shows
        what they would offer, which is why the field is not empty there.
      properties:
        start:
          type: string
          default: ''
          readOnly: true
        end:
          type: string
          default: ''
          readOnly: true
        available_durations:
          type: array
          default: []
          items:
            type: integer
            default: 0
          readOnly: true
      required:
      - available_durations
      - end
      - start
    SlotBuckets:
      type: object
      properties:
        available_slots:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/Slot'
          readOnly: true
        booked_slots:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/Slot'
          readOnly: true
      required:
      - available_slots
      - booked_slots
    SplitPreview:
      type: object
      description: |-
        How a purchase would be divided between the wallet and the card (ADR-0032).

        A read-only answer, and the **only** place a client should get these numbers.
        The eight rules that produce them — the two floors, the reduction that keeps
        the card leg legal, the cases where there is no split at all — live in
        ``apps.wallet.split`` and are not something a client can re-derive from a
        balance and a couple of settings without getting rule 4 wrong.

        ``outcome`` is carried so the app can say *why* rather than just show a
        disabled switch: a balance of 0.25 and a price of 4.00 are both "no split",
        for completely different reasons, and the player is owed the difference.
      properties:
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        from_wallet:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        from_card:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        outcome:
          type: string
          default: ''
          readOnly: true
        is_split:
          type: boolean
          readOnly: true
        minimum_card_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        minimum_wallet_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - balance
      - from_card
      - from_wallet
      - is_split
      - minimum_card_amount
      - minimum_wallet_amount
      - outcome
      - total
