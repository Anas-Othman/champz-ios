    Role:
      type: object
      description: A role and the permissions its group carries.
      properties:
        id:
          type: string
          default: ''
          readOnly: true
        name:
          type: string
          default: ''
          readOnly: true
        description:
          type: string
          default: ''
          readOnly: true
        permissions:
          type: array
          default: []
          items:
            type: string
            default: ''
          readOnly: true
        sections:
          type: object
          additionalProperties:
            type: array
            default: []
            items:
              type: string
              default: ''
          description: |-
            What the role screen ticked: ``{section: [actions]}``, plain keys.

            Read from the marker permissions alone — never inferred from the model
            permissions, which overlap between screens (see
            ``apps.core.panel_sections``).
          readOnly: true
        user_count:
          type: integer
          default: 0
          readOnly: true
        legacy_role_id:
          type: integer
          default: 0
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - id
      - legacy_role_id
      - name
      - permissions
      - sections
      - user_count
    RoleWrite:
      type: object
      description: |-
        Create or rename a role and set the permissions on its group.

        Permissions arrive as ``app_label.codename`` strings. An unknown code is a
        validation error rather than a silent drop: a panel that thinks it granted
        something it did not is worse than one that shows an error.
      properties:
        name:
          type: string
          default: ''
          maxLength: 255
        description:
          type: string
          default: ''
        permissions:
          type: array
          default: []
          items:
            type: string
            default: ''
        sections:
          type: object
          additionalProperties:
            type: array
            default: []
            items:
              type: string
              default: ''
      required:
      - name
    Scoreboard:
      type: object
      properties:
        team_scores:
          type: array
          default: []
